<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SmartInventoryX — Pro UI</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">📦</div>
        <div>
          <div class="brand-title">SmartInventoryX</div>
          <div class="brand-sub">Warehouse Manager</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></button>
        <button class="nav-item" data-view="inbound"><i data-lucide="download"></i><span>Nhập kho</span></button>
        <button class="nav-item" data-view="outbound"><i data-lucide="upload"></i><span>Xuất kho</span></button>
        <button class="nav-item" data-view="stock"><i data-lucide="box"></i><span>Tồn kho</span></button>
        <button class="nav-item" data-view="reports"><i data-lucide="bar-chart-3"></i><span>Báo cáo</span></button>
        <button class="nav-item" data-view="settings"><i data-lucide="settings"></i><span>Cài đặt</span></button>
      </nav>

      <div class="sidebar-footer">
        <div class="theme-switch">
          <label>Giao diện</label>
          <div class="theme-buttons">
            <button id="theme-blue" class="theme-btn">Blue</button>
            <button id="theme-dark" class="theme-btn">Dark</button>
          </div>
        </div>
        <div class="version">v1.2 · DO AN 2</div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <div class="top-left">
          <button id="btn-toggle" class="icon-btn">☰</button>
          <h1 class="top-title">SmartInventoryX</h1>
        </div>

        <div class="top-right">
          <input id="search" placeholder="Tìm UID / mã / tên..." class="search" />
          <span id="whoami" style="margin-left:12px;opacity:.75"></span>
          <button id="refresh" class="btn small">⟳</button>
        </div>
      </header>

      <main class="content">
        <!-- ... (phần nội dung giữ nguyên) ... -->
      </main>

      <footer class="footer">© 2025 · SmartInventoryX · DO AN 2</footer>
    </div>
  </div>

  <!-- Toast / Loading -->
  <div id="toast" class="toast hidden"></div>
  <div id="loading" class="loading hidden">Đang tải…</div>

  <!-- Firebase SDK (phải đặt TRƯỚC script chính) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- Script chính -->
  <script src="script.js?v=final" defer></script>
  <script>lucide.createIcons();</script>
</body>
</html>
